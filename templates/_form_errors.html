{% if form.non_field_errors %}
<div class="alert alert-danger d-flex gap-2 align-items-start" role="alert">
  <i class="bi bi-exclamation-octagon-fill mt-1"></i>
  <div>{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>
</div>
{% elif form.errors %}
<div class="alert alert-danger d-flex gap-2 align-items-center" role="alert">
  <i class="bi bi-exclamation-octagon-fill"></i><div>Please fix the highlighted field{{ form.errors|length|pluralize }} below.</div>
</div>
{% endif %}
