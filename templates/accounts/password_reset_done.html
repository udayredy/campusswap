{% extends "base.html" %}{% load market_extras %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:520px">
  <div class="cs-card p-4 p-lg-5 shadow-sm">
    <div class="text-center"><i class="bi bi-envelope-check fs-1" style="color:var(--cs-amber-dark)"></i>
    <h1 class="h4 mt-2">Check your email</h1>
    <p class="text-muted">If an account exists for that address, a reset link is on its way. It expires in 3 days.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to log in</a></div>
  </div>
</div>
{% endblock %}
