{% with c=listing.cover %}{% if c %}<img src="{{ c.image.url }}" alt="{{ listing.title }}" loading="lazy" class="{% if listing.category == 'BOOK' %}fit-book{% endif %}">{% else %}<div class="placeholder-cover ph-{{ listing.category }}" role="img" aria-label="{{ listing.get_category_display }}"><i class="bi {{ listing.icon }}"></i></div>{% endif %}{% endwith %}
